<div class="h-full relative overflow-hidden">

  <div class="absolute top-4 left-1/2 -translate-x-1/2 z-10 flex items-center gap-2 bg-gray-900/90 text-white px-4 py-2 rounded-full shadow-lg border border-gray-700 backdrop-blur-sm text-sm font-medium">
    <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
    <span>Overpass Requests: <strong class="text-emerald-400 font-bold ml-1">{{ requestCount() }}</strong></span>
  </div>


  <mgl-map [mapStyle]="currentStyle" [zoom]="[14]" [center]="[initialCoords.long, initialCoords.lat]"
    (mapLoad)="onMapLoad($event)" (moveEnd)="onMapMove($event)" class="h-full w-full">

    @for (source of mapSources; track source.id) {
    <mgl-geojson-source [id]="source.id" [cluster]="false">
    </mgl-geojson-source>

    <mgl-layer [id]="source.id + '-icon'" type="symbol" [source]="source.id" [layout]="{
    'icon-image': ['get', 'icon-name'],
    'icon-size': 0.15,
    'icon-allow-overlap': true,
    'icon-anchor': 'bottom'
  }" (layerClick)="onMarkerClick($event)">
    </mgl-layer>
    }

    <mgl-control mglGeolocate [positionOptions]="{enableHighAccuracy: true}" [trackUserLocation]="true"></mgl-control>
    <mgl-control mglNavigation position="top-right"></mgl-control>
  </mgl-map>

  <div class="fixed bottom-24 right-8 flex flex-col gap-2">
    <button (click)="goToCurrentLocation()"
      [class]="isAtCurrentLocation ? 'bg-gray-800 text-blue-600' : 'bg-gray-800 text-white'"
      class="rounded-full p-4 shadow-lg hover:bg-gray-900 transition">
      <hugeicons-icon
        [icon]="isAtCurrentLocation ? locateFixedIcon : (currentPosition ? locateIcon : locateOffIcon)"></hugeicons-icon>
    </button>
  </div>
</div>
